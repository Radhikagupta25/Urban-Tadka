services:
  - type: web
    name: urban-tadka-api
    runtime: node
    rootDir: server
    plan: free            # use a paid plan for real orders (free instances sleep)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_VERSION, value: "20" }
      - { key: NODE_ENV, value: production }
      - { key: JWT_SECRET, generateValue: true }
      - { key: MONGODB_URI, sync: false }
      - { key: CLIENT_URL, sync: false }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: RAZORPAY_WEBHOOK_SECRET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: RESTAURANT_EMAIL, sync: false }
      - { key: RESTAURANT_NAME, value: Urban Tadka }
      - { key: RESTAURANT_PHONE, sync: false }
      - { key: RESTAURANT_ADDRESS, sync: false }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }

  - type: web
    name: urban-tadka-web
    runtime: static
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - { key: NODE_VERSION, value: "20" }
      - { key: VITE_API_URL, sync: false }
    routes:
      - { type: rewrite, source: /*, destination: /index.html }